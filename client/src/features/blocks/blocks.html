<div class="flex justify-between items-center">
  @if (paginatedBlockedMembers()?.metadata; as metadata) {
    <app-paginator
      [hidden]="metadata.totalCount === 0"
      [pageNumber]="metadata.currentPage"
      [pageSize]="metadata.pageSize"
      [totalCount]="metadata.totalCount"
      [totalPages]="metadata.totalPages"
      (pageChange)="onPageChange($event)"
    />
  }
</div>

<div class="overflow-x-auto mt-3">
  <table class="table bg-base-100 table-fixed w-full">
    <thead>
      <tr>
        <th class="w-2/7">Blocked User</th>
        <th class="w-3/7">Reason</th>
        <th class="w-1/7">Edit</th>
        <th class="w-1/7">Unblock</th>
      </tr>
    </thead>
    <tbody>
      @for (block of paginatedBlockedMembers()?.items; track block.id) {
        <tr>
          <td class="w-2/7">
            <div class="flex items-center gap-3">
              <div class="h-12 w-12">
                <img
                  class="rounded-full"
                  src="{{ block.imageUrl || '/user.png' }}"
                  alt="image of member"
                />
              </div>
              <div>{{ block.displayName }}</div>
            </div>
          </td>
          <td class="truncate w-3/7"></td>
          <td class="w-1/7">
            <button
              (click)="editReason(block)"
              class="btn btn-primary text-white hover:btn-outline cursor-pointer"
            >
              Edit Reason
            </button>
          </td>
          <td class="w-1/7">
            <button (click)="unblock(block.id)" class="btn btn-circle btn-ghost text-error">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="currentColor"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="size-6"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"
                />
              </svg>
            </button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
